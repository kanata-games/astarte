<script>
'use strict';
// ===== data: weapons / enemies / boss =====
const VW = 384, VH = 288, T = 16, DT = 1 / 60, GRAV = 900;
// Weapons are pure data: add an entry here (timings/hitboxes/sfx) + a motion set in ASTA.MOTIONS (src/04b_astarte.js)

              { id: 'chop', range: 50, wu: .7, act: .15, rec: .8, dmg: 28, bw: 48, bh: 50, lunge: 30, parry: false, cd: 1.6 }] },
  wisp:   { name: '迷い火', hp: 40, souls: 30, w: 20, h: 20, speed: 55, sight: 180, fly: true, poise: 5, col: '#7fb8ff',
    attacks: [{ id: 'dive', range: 168, wu: .75, act: .45, rec: .9, dmg: 14, bw: 22, bh: 22, parry: false, cd: 1.8, dash: 260 }] },

    attacks: [{ id: 'orb', range: 308, wu: .9, act: .05, rec: 1.0, dmg: 16, parry: false, cd: 2.2, shot: 110 }] },
};
const BOSS = { name: '弔鐘の騎士 ノクターン', hp: 950, souls: 2000, w: 48, h: 84, poise: 999,
  // per-attack data; phase 2 (<50% hp) scales windups by .82

const LEVEL_COST = lv => 120 + lv * 60;

// ---- sprite metadata embedded at build time (tools/build.py) ----
const EMBEDDED_META = {"astarte_pan":{"cw":144,"ch":112,"ax":64,"ay":100,"anims":{"idle":{"row":0,"n":6,"ph":["","","","","",""]},"run":{"row":1,"n":8,"ph":["","","","","","","",""]},"jump":{"row":2,"n":2,"ph":["",""]},"fall":{"row":3,"n":2,"ph":["",""]},"land":{"row":4,"n":2,"ph":["",""]},"roll":{"row":5,"n":6,"ph":["","","","","",""]},"light1":{"row":6,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"light2":{"row":7,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"light3":{"row":8,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"heavy":{"row":9,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"parry":{"row":10,"n":4,"ph":["","","",""]},"parryflash":{"row":11,"n":3,"ph":["","",""]},"riposte":{"row":12,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"hit":{"row":13,"n":3,"ph":["","",""]},"death":{"row":14,"n":6,"ph":["","","","","",""]},"rest":{"row":15,"n":4,"ph":["","","",""]},"flask":{"row":16,"n":6,"ph":["","","","","",""]},"turn":{"row":17,"n":3,"ph":["","",""]}}},"astarte_scythe":{"cw":144,"ch":112,"ax":64,"ay":100,"anims":{"idle":{"row":0,"n":6,"ph":["","","","","",""]},"run":{"row":1,"n":8,"ph":["","","","","","","",""]},"jump":{"row":2,"n":2,"ph":["",""]},"fall":{"row":3,"n":2,"ph":["",""]},"land":{"row":4,"n":2,"ph":["",""]},"roll":{"row":5,"n":6,"ph":["","","","","",""]},"light1":{"row":6,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"light2":{"row":7,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"light3":{"row":8,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"heavy":{"row":9,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"parry":{"row":10,"n":4,"ph":["","","",""]},"parryflash":{"row":11,"n":3,"ph":["","",""]},"riposte":{"row":12,"n":6,"ph":["wu","wu","act","act","rec","rec"]},"hit":{"row":13,"n":3,"ph":["","",""]},"death":{"row":14,"n":6,"ph":["","","","","",""]},"rest":{"row":15,"n":4,"ph":["","","",""]},"flask":{"row":16,"n":6,"ph":["","","","","",""]},"turn":{"row":17,"n":3,"ph":["","",""]}}}};
// ===== core: canvas, input, utils =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const Q = new URLSearchParams(location.search), TESTMODE = Q.has('test');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
let RNG = 12345; const rnd = () => (RNG = (RNG * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---- input: actions held + pressed-this-frame (with a short buffer) ----
const ACT = ['left', 'right', 'up', 'down', 'jump', 'light', 'heavy', 'roll', 'parry', 'flask', 'swap', 'start'];
const held = {}, buf = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', KeyE: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyK: 'jump', KeyZ: 'light', KeyJ: 'light', KeyX: 'heavy', KeyU: 'heavy', KeyC: 'roll', KeyL: 'roll', ShiftLeft: 'roll', ShiftRight: 'roll',
  KeyV: 'parry', KeyI: 'parry', KeyF: 'flask', KeyR: 'flask', KeyQ: 'swap', Enter: 'start', Escape: 'start' };
function press(a) { if (!held[a]) buf[a] = 0.15; held[a] = true; }
function release(a) { held[a] = false; }
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (a) { press(a); e.preventDefault(); } audioInit(); });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
function pressed(a) { if (buf[a] > 0) { buf[a] = 0; return true; } return false; }
function peek(a) { return buf[a] > 0; }
function tickInput(dt) { for (const k in buf) buf[k] = Math.max(0, buf[k] - dt); }

// ---- touch pad ----
const TOUCH = [
  { a: 'left', l: '◀', x: .04, y: .80, s: 64, sq: 1 }, { a: 'right', l: '▶', x: .24, y: .80, s: 64, sq: 1 }, { a: 'up', l: '▲', x: .14, y: .66, s: 52, sq: 1 },
  { a: 'light', l: '軽', x: .86, y: .74, s: 62 }, { a: 'heavy', l: '重', x: .86, y: .58, s: 52 }, { a: 'jump', l: '跳', x: .70, y: .84, s: 58 },
  { a: 'roll', l: '転', x: .70, y: .66, s: 54 }, { a: 'parry', l: '弾', x: .55, y: .84, s: 50 }, { a: 'flask', l: '薬', x: .04, y: .06, s: 44, sq: 1 },
  { a: 'swap', l: '換', x: .16, y: .06, s: 44, sq: 1 }, { a: 'start', l: '≡', x: .90, y: .06, s: 40, sq: 1 } ];
const touchEl = document.getElementById('touch');
for (const b of TOUCH) {
  const d = document.createElement('div'); d.className = 'tb' + (b.sq ? ' sq' : ''); d.textContent = b.l; b.el = d; touchEl.appendChild(d);
  const on = e => { e.preventDefault(); press(b.a); d.classList.add('on'); audioInit(); }, off = e => { e.preventDefault(); release(b.a); d.classList.remove('on'); };
  d.addEventListener('touchstart', on, { passive: false }); d.addEventListener('touchend', off, { passive: false }); d.addEventListener('touchcancel', off, { passive: false });
  d.addEventListener('mousedown', on); d.addEventListener('mouseup', off); d.addEventListener('mouseleave', off);
}
if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || Q.has('touch')) touchEl.classList.add('on');
function layout() {
  const W = innerWidth, H = innerHeight, s = Math.max(1, Math.min(W / VW, H / VH));
  const gw = VW * s, gh = VH * s, top = (touchEl.classList.contains('on') && H > W) ? Math.max(0, H * .12) : (H - gh) / 2;
  Object.assign(cv.style, { width: gw + 'px', height: gh + 'px', left: (W - gw) / 2 + 'px', top: top + 'px' });
  for (const b of TOUCH) Object.assign(b.el.style, { left: b.x * W + 'px', top: b.y * H + 'px', width: b.s + 'px', height: b.s + 'px' });
}
addEventListener('resize', layout); layout();

// ---- tiny synth sfx ----
let AC = null;
function audioInit() { if (AC || TESTMODE) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
function sfx(f, d = .08, type = 'square', vol = .06, slide = 0) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const SFX = { swing: () => sfx(300, .07, 'triangle', .05, -200), hit: () => sfx(140, .1, 'square', .07, -80), parry: () => { sfx(1400, .25, 'triangle', .08, -300); sfx(2100, .18, 'sine', .05) },
  roll: () => sfx(90, .1, 'sine', .05), hurt: () => sfx(220, .18, 'sawtooth', .06, -150), bell: () => { sfx(330, .9, 'sine', .07); sfx(495, .7, 'sine', .04) }, souls: () => sfx(880, .2, 'sine', .05, 400),
  whoosh: () => { sfx(180, .16, 'triangle', .05, -120); sfx(90, .2, 'sine', .04) }, swish: () => sfx(520, .06, 'triangle', .04, -250),
  bonk: () => { sfx(240, .12, 'square', .06, -60); sfx(720, .25, 'sine', .04) }, clang: () => { sfx(988, .9, 'sine', .07); sfx(1480, .7, 'sine', .04); sfx(2220, .5, 'triangle', .03); sfx(660, 1.1, 'sine', .04) },
  heal: () => sfx(520, .3, 'sine', .05, 300), die: () => sfx(160, .8, 'sawtooth', .06, -120) };
// ===== art: everything is drawn by script (pixel art), gothic palette =====
const PAL = { navy: '#20245a', navyD: '#141640', navyL: '#343a86', gold: '#d9b45a', goldD: '#9a7a32', hair: '#eef0f7', hairS: '#b9bfd8',
  skin: '#f7dccb', eye: '#3d6fe6', white: '#f1f1f6', whiteS: '#c9cbd9', tights: '#26222e', pink: '#f2a6b4', shaft: '#2a2026', blade: '#dfe4f0', bladeS: '#9aa3bc' };
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }

// ---- tiles ----
const TILESET = (() => {
  const c = mk(T * 4, T), g = c.getContext('2d');
  for (let v = 0; v < 3; v++) {     // stone bricks variants
    const ox = v * T; R(g, ox, 0, T, T, '#2b2836');
    for (let row = 0; row < 2; row++) { const off = (row + v) % 2 ? 8 : 0;
      for (let b = -1; b < 2; b++) { const bx = ox + b * 8 + off; R(g, Math.max(ox, bx), row * 8, Math.min(7, ox + T - Math.max(ox, bx)), 7, ['#3a3648', '#35324a', '#403b4e'][(b + row + v + 3) % 3]); } }
    R(g, ox, 0, T, 1, '#4c4760'); if (v === 2) { R(g, ox + 3, 9, 3, 1, '#2f5a3a'); R(g, ox + 10, 3, 2, 1, '#2f5a3a'); } }
  R(g, 3 * T, 0, T, 4, '#5a4a3a'); R(g, 3 * T, 0, T, 1, '#8a7050'); R(g, 3 * T + 2, 4, 2, 4, '#3a2e26'); R(g, 3 * T + 12, 4, 2, 4, '#3a2e26'); // wooden platform
  return c; })();

// ---- parallax background (pre-rendered) ----
const BG = (() => {
  const W = 768, c = mk(W, VH), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, '#0b0a18'); gr.addColorStop(1, '#1a1428'); g.fillStyle = gr; g.fillRect(0, 0, W, VH);
  for (let i = 0; i < 60; i++) R(g, (i * 97) % W, (i * 53) % 120, 1, 1, i % 4 ? '#3a3858' : '#8a88b8');
  for (let k = 0; k < 4; k++) { const x = k * 192 + 40;               // far arched windows w/ moonlight
    g.fillStyle = '#100e1e'; g.fillRect(x - 6, 30, 92, 220);
    g.fillStyle = '#1e2448'; g.beginPath(); g.moveTo(x, 200); g.lineTo(x, 90); g.arc(x + 40, 90, 40, Math.PI, 0); g.lineTo(x + 80, 200); g.fill();
    g.fillStyle = '#2c3670'; g.fillRect(x + 38, 52, 4, 148); g.fillRect(x, 120, 80, 3);
    g.fillStyle = 'rgba(160,180,255,.06)'; g.beginPath(); g.moveTo(x, 200); g.lineTo(x + 80, 200); g.lineTo(x + 140, 288); g.lineTo(x + 30, 288); g.fill(); }
  return c; })();
const BG2 = (() => { // near pillars + chains
  const W = 512, c = mk(W, VH), g = c.getContext('2d');
  for (let k = 0; k < 2; k++) { const x = k * 256 + 90; R(g, x, 0, 28, VH, '#17141f'); R(g, x + 2, 0, 3, VH, '#221e2e'); R(g, x - 6, 40, 40, 8, '#1d1a28'); R(g, x - 6, 230, 40, 10, '#1d1a28');
    for (let y = 0; y < 120; y += 6) R(g, x + 60 + (y % 12 ? 0 : 1), y, 2, 4, '#1a1724'); }
  return c; })();

// ---- Astarte ----
// pose: {k:'idle'|'run'|'air'|'roll'|'atk'|'parry'|'hurt'|'flask'|'rest'|'dead', t, wa (weapon angle)}
function drawAstarte(g, x, y, face, pose, wpn) {
  g.save(); g.translate(Math.round(x), Math.round(y)); if (face < 0) g.scale(-1, 1);
  const k = pose.k, t = pose.t || 0;
  if (k === 'roll') { g.rotate(t * Math.PI * 2 * 2.2); R(g, -11, -11, 22, 22, PAL.navy); R(g, -9, -13, 18, 4, PAL.navyL); R(g, -6, -8, 12, 8, PAL.hair); R(g, 4, -2, 6, 6, PAL.white); R(g, -12, 2, 5, 6, PAL.hair); R(g, -2, 9, 4, 2, PAL.gold); g.restore(); return; }
  if (k === 'dead') { g.rotate(-Math.PI / 2 * Math.min(1, t * 2)); }
  const run = k === 'run' ? Math.sin(t * 14) : 0, bob = k === 'run' ? Math.abs(run) * -2 : (k === 'idle' ? Math.round(Math.sin(t * 2.5)) : 0);
  const kneel = k === 'rest' || k === 'flask' ? 8 : 0;
  // tail (behind)
  const tw = Math.round(Math.sin(t * 3) * 2);
  R(g, -16, -32, 5, 10, PAL.hair); R(g, -20, -42 + tw, 5, 12, PAL.hair); R(g, -17, -47 + tw, 6, 5, PAL.hair); R(g, -20, -40 + tw, 2, 8, PAL.hairS);
  // back robe panel
  R(g, -14, -42 + kneel, 9, 30 - kneel, PAL.navyD); R(g, -15, -14, 10, 2, PAL.goldD);
  // legs / boots
  const l1 = Math.round(run * 4), l2 = -l1;
  if (!kneel) { R(g, -6 + l1, -16, 4, 11, PAL.tights); R(g, 3 + l2, -16, 4, 11, PAL.tights); R(g, -7 + l1, -6, 7, 6, PAL.navyD); R(g, 2 + l2, -6, 8, 6, PAL.navyD); R(g, -6 + l1, -4, 5, 1, PAL.gold); R(g, 3 + l2, -4, 5, 1, PAL.gold); }
  else { R(g, -8, -6, 16, 6, PAL.navyD); }
  g.translate(0, bob + kneel);
  // skirt layers
  R(g, -12, -27, 24, 12, PAL.white); R(g, -13, -17, 26, 3, '#ffffff'); R(g, -12, -15, 4, 1, PAL.whiteS); R(g, 0, -15, 5, 1, PAL.whiteS);
  // robe front + side with stars
  R(g, -14, -42, 7, 26, PAL.navy); R(g, 6, -42, 8, 24, PAL.navy); R(g, -14, -17, 7, 1, PAL.gold); R(g, 6, -19, 8, 1, PAL.gold);
  R(g, -11, -30, 1, 1, PAL.gold); R(g, 9, -26, 1, 1, PAL.gold); R(g, 11, -34, 1, 1, PAL.gold); R(g, -12, -22, 2, 2, PAL.gold);
  // torso, belt, bell
  R(g, -6, -44, 12, 16, PAL.white); R(g, -7, -32, 14, 3, PAL.navyD); R(g, -1, -32, 3, 3, PAL.gold); R(g, 4, -31, 1, 1, PAL.gold);
  R(g, -10, -47, 21, 6, PAL.navy); R(g, -10, -42, 21, 1, PAL.gold); R(g, 0, -42, 3, 3, PAL.gold); R(g, 1, -39, 1, 1, PAL.goldD);
  // head
  const hy = k === 'hurt' ? 1 : 0;
  R(g, -9, -60 + hy, 18, 15, PAL.hair); R(g, -9, -46 + hy, 4, 4, PAL.hairS); R(g, 6, -47 + hy, 3, 4, PAL.hair);
  R(g, -2, -56 + hy, 10, 10, PAL.skin); R(g, -3, -58 + hy, 11, 4, PAL.hair); R(g, 2, -55 + hy, 2, 1, PAL.hair);
  const blink = k === 'idle' && (t % 3.2) > 3.05;
  if (blink || k === 'rest') R(g, 3, -51 + hy, 3, 1, '#4a3a4a'); else { R(g, 3, -53 + hy, 3, 4, PAL.eye); R(g, 3, -53 + hy, 1, 1, '#fff'); R(g, 3, -50 + hy, 3, 1, '#1d2f78'); }
  R(g, 6, -48 + hy, 1, 1, '#d89a9a');
  // hood + gold trim + ears
  R(g, -11, -62 + hy, 20, 5, PAL.navy); R(g, -13, -60 + hy, 5, 18, PAL.navy); R(g, -11, -57 + hy, 19, 1, PAL.gold); R(g, 7, -60 + hy, 3, 5, PAL.navy);

  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt); G.areaT -= dt;

}
function startGame() { G.mode = 'play'; G.dead = {}; G.bossDown = false; G.stain = null; G.pickups = {}; G.lit = { 0: true }; G.check = { ri: 0, x: 6 };
  Object.assign(P, { hp: 100, stam: 100, flasks: MAXFLASK, souls: 0, lv: { vit: 0, end: 0, str: 0 }, weapons: ['scythe'], wi: 0, state: 'free', face: 1, x: 3 * T, iframe: 0 });
  for (const k in STATS) STATS[k] = k === 'takenBy' ? {} : 0; enterRoom(0); G.toast('↑ で星の灯火に触れて休息', 3); }

// ---------- render ----------
function drawRoom(g) {
  const r = G.room, cam = Math.round(G.cam), x0 = Math.floor(cam / T), x1 = Math.min(r.def.w - 1, x0 + VW / T + 1);
  for (let y = 0; y < ROWS; y++) for (let x = x0; x <= x1; x++) { const t = r.grid[y][x]; if (!t) continue;
    if (t === 2) g.drawImage(TILESET, 3 * T, 0, T, T, x * T - cam, y * T, T, T);
    else { const v = (x * 7 + y * 13) % 5 === 0 ? 2 : (x + y) % 2; g.drawImage(TILESET, v * T, 0, T, T, x * T - cam, y * T, T, T);
      if (y > 0 && r.grid[y - 1][x] !== 1) { R(g, x * T - cam, y * T, T, 2, '#5a546e'); if ((x * 3) % 7 === 0) R(g, x * T - cam + 4, y * T - 3, 2, 3, '#3a4a3a'); } } }
}
function render() {

  const d = G.room.def;
  if (d.bonfire !== undefined) { drawBonfire(g, d.bonfire * T + 8 - cam, floorY(G.room, d.bonfire), G.t, !!G.lit[G.ri] || true);
    if (Math.abs(P.x + P.w / 2 - (d.bonfire * T + 8)) < 28 && !G.menu) txt(g, '▲ 休息する', d.bonfire * T + 8 - cam, floorY(G.room, d.bonfire) - 60, '#ffe8a8', 10, 'center'); }
  if (d.fog && !G.bossDown) { g.globalAlpha = .45 + .1 * Math.sin(G.t * 2); R(g, G.room.w - 18 - cam, 32, 18, floorY(G.room, d.w - 1) - 32, '#d8d8ff'); g.globalAlpha = 1; }
  if (d.pickup && !G.pickups[G.ri]) { const px = d.pickup.x * T + 8 - cam, py = d.pickup.row * T - 8; g.globalAlpha = .5 + .4 * Math.sin(G.t * 5); g.fillStyle = '#fff4c0'; g.beginPath(); g.arc(px, py, 5, 0, 7); g.fill(); g.globalAlpha = 1; }
  if (G.stain && G.stain.ri === G.ri) { const sx = G.stain.x - cam; g.globalAlpha = .6 + .3 * Math.sin(G.t * 4); g.fillStyle = '#7af0e0'; g.beginPath(); g.ellipse(sx, G.stain.y - 3, 10, 4, 0, 0, 7); g.fill(); R(g, sx - 1, G.stain.y - 18 - Math.round(Math.sin(G.t * 3) * 3), 3, 8, '#c8fff4'); g.globalAlpha = 1; }
  g.save(); g.translate(-cam, 0);
  for (const s of G.shots) {
    if (s.kind === 'pillar') { if (s.t < s.warn) { g.globalAlpha = .25 + .25 * Math.sin(s.t * 20); R(g, s.x, 236, s.w, 4, '#ff5a3a'); R(g, s.x + s.w / 2 - 1, 40, 2, 196, '#ff5a3a'); g.globalAlpha = 1; } else { R(g, s.x, s.y, s.w, s.h, '#ffeec0'); R(g, s.x + 6, s.y, s.w - 12, s.h, '#fff'); } }
    else if (s.kind === 'wave') { if (s.delay > 0) g.globalAlpha = .4; R(g, s.x, s.y + 6, s.w, s.h - 6, '#8a90b8'); R(g, s.x + 3, s.y, s.w - 6, 8, '#c8ccf0'); g.globalAlpha = 1; }
    else { g.fillStyle = '#d070ff'; g.beginPath(); g.arc(s.x + 5, s.y + 5, 6, 0, 7); g.fill(); R(g, s.x + 3, s.y + 3, 4, 4, '#fff0ff'); }
  }
  for (const e of G.enemies) if (e.hp > 0) { if (e.flash > 0) g.filter = 'brightness(3)'; drawEnemy(g, e); g.filter = 'none';
    if (e.state === 'windup') txt(g, '!', e.x + e.w / 2, e.y - 6, e.atk.parry ? '#ffffff' : '#ff4a3a', 14, 'center');
    if (e.stagger > 0 && e.parried) txt(g, '致命', e.x + e.w / 2, e.y - 6, '#ffe08a', 10, 'center');
    if (e.hp < e.d.hp) { R(g, e.x, e.y - 14, e.w, 3, '#200'); R(g, e.x, e.y - 14, e.w * e.hp / e.d.hp, 3, '#c03050'); } }
  if (G.boss && (G.boss.hp > 0 || G.endT < 1.5)) { const b = G.boss; if (b.flash > 0) g.filter = 'brightness(2.5)'; if (b.hp <= 0) g.globalAlpha = Math.max(0, 1 - G.endT); drawBoss(g, b); g.filter = 'none'; g.globalAlpha = 1;
    if (b.stagger > 0 && b.parried) txt(g, '致命', b.x + b.w / 2, b.y - 30, '#ffe08a', 11, 'center'); }
  if (P.ghosts) for (const gh of P.ghosts) ASTA.draw(g, gh.x, gh.y, gh.face, 'roll', gh.f, P.weapons[P.wi], gh.a * .5);
  const pp = playerPose(); if (P.state === 'hurt' && P.st < .08) g.filter = 'brightness(2.2)'; if (P.iframe > 0 && P.state === 'free' && (G.t * 20 | 0) % 2) g.globalAlpha = .6;
  ASTA.draw(g, P.x + P.w / 2, P.y + P.h, P.face, pp.anim, pp.f, P.weapons[P.wi]); g.filter = 'none'; g.globalAlpha = 1;
  for (const f of G.fx) { if (f.ring) { g.strokeStyle = f.col; g.lineWidth = 2; g.globalAlpha = f.life / .3; g.beginPath(); g.arc(f.x, f.y, (.3 - f.life) * 120, 0, 7); g.stroke(); g.globalAlpha = 1; } else if (f.star) { R(g, f.x - 2, f.y, 5, 1, f.col); R(g, f.x, f.y - 2, 1, 5, f.col); } else { if (f.life < .2) g.globalAlpha = f.life / .2; R(g, f.x, f.y, f.sz, f.sz, f.col); g.globalAlpha = 1; } }

  g.setTransform(1, 0, 0, 1, 0, 0); drawHUD(g);
}
function txt(g, s, x, y, c, size = 10, al = 'left') { g.font = `bold ${size}px "Hiragino Mincho ProN","Yu Mincho",serif`; g.textAlign = al; g.fillStyle = '#000'; g.fillText(s, x + 1, y + 1); g.fillStyle = c; g.fillText(s, x, y); }
function bar(g, x, y, w, h, f, c, bg) { R(g, x - 1, y - 1, w + 2, h + 2, '#000'); R(g, x, y, w, h, bg || '#2a1a24'); R(g, x, y, Math.max(0, w * f), h, c); R(g, x, y, Math.max(0, w * f), 1, 'rgba(255,255,255,.35)'); }
function drawHUD(g) {
  bar(g, 10, 10, pMaxHp() * 1.1, 6, P.hp / pMaxHp(), '#c03050'); bar(g, 10, 20, pMaxStam() * 1.1, 4, P.stam / pMaxStam(), '#4ab07a', '#1a2a20');
  for (let i = 0; i < MAXFLASK; i++) { const on = i < P.flasks; R(g, 10 + i * 11, 30, 7, 9, on ? '#e8a040' : '#3a3040'); R(g, 12 + i * 11, 28, 3, 2, on ? '#fff2c0' : '#555'); }
  txt(g, weapon().name, 46, 38, '#c8c4e8', 9);
  txt(g, '✦ ' + P.souls, VW - 10, VH - 10, '#bff4ff', 12, 'right');
  if (G.boss && G.boss.hp > 0 && G.boss.state !== 'intro') { txt(g, BOSS.name, 60, VH - 26, '#e8e0d0', 10); bar(g, 60, VH - 20, VW - 120, 6, G.boss.hp / BOSS.hp, '#a83040'); }
  if (G.areaT > 0) { g.globalAlpha = Math.min(1, G.areaT); txt(g, G.room.def.name, VW / 2, 74, '#e8e0ff', 16, 'center'); R(g, VW / 2 - 80, 80, 160, 1, '#8a80b0'); g.globalAlpha = 1; }
  G.toasts.forEach((q, i) => { g.globalAlpha = Math.min(1, q.t); R(g, 0, 110 + i * 20, VW, 18, 'rgba(0,0,0,.5)'); txt(g, q.s, VW / 2, 123 + i * 20, '#f0e8c8', 11, 'center'); g.globalAlpha = 1; });
  if (P.state === 'dead') { g.globalAlpha = Math.min(1, P.st); R(g, 0, VH / 2 - 24, VW, 40, 'rgba(0,0,0,.7)'); txt(g, '星 は 堕 ち た', VW / 2, VH / 2 + 4, '#c03050', 22, 'center'); g.globalAlpha = 1; }
  if (G.bossDown && G.mode === 'play' && G.endT > .5) { g.globalAlpha = Math.min(1, G.endT - .5); R(g, 0, VH / 2 - 24, VW, 40, 'rgba(0,0,0,.6)'); txt(g, '弔 鐘 、止 む', VW / 2, VH / 2 + 4, '#ffe08a', 22, 'center'); g.globalAlpha = 1; }
  if (G.menu) { R(g, VW / 2 - 100, 60, 200, 140, 'rgba(10,8,24,.88)'); R(g, VW / 2 - 100, 60, 200, 1, PAL.gold);
    txt(g, '星の灯火 ― 休息', VW / 2, 80, '#ffe8a8', 12, 'center'); txt(g, `Lv ${plv() + 1}　必要ソウル ${LEVEL_COST(plv())}`, VW / 2, 98, '#bff4ff', 9, 'center');
    MENU.forEach((m, i) => { const v = m.k === 'x' ? '' : ' ' + P.lv[m.k]; txt(g, (G.menu.sel === i ? '▶ ' : '　') + m.n + v, VW / 2 - 80, 120 + i * 18, G.menu.sel === i ? '#fff' : '#9a94c0', 11); }); }
  if (G.mode === 'pause') { R(g, 0, 0, VW, VH, 'rgba(0,0,0,.7)'); const L = ['― 操作 ―', '移動: ←→ / A D　　休息: ↑ / W / E', 'ジャンプ: Space / K　（↓+ジャンプで足場を降りる）', '軽攻撃: Z / J　　重攻撃: X / U', 'ローリング: C / L / Shift （無敵時間あり）', 'パリィ: V / I　（白く光る攻撃を弾く → 軽攻撃で致命）', 'エスト(薬): F / R　　武器持ち替え: Q', '赤く光る攻撃はパリィ不可。避けよう。', '', 'Enter / Esc で戻る'];
    L.forEach((s, i) => txt(g, s, VW / 2, 50 + i * 20, i ? '#e0dcf0' : '#ffe08a', 11, 'center')); }
}
function drawTitle(g) {
  g.drawImage(BG, -(G.t * 6 % 768), 0); g.drawImage(BG, 768 - (G.t * 6 % 768), 0); R(g, 0, 0, VW, VH, 'rgba(5,4,14,.45)');
  g.save(); g.translate(VW / 2 + 90, 236); g.scale(2, 2); ASTA.draw(g, 0, 0, -1, 'idle', (G.t / .2) % 6, 'scythe'); g.restore();
  txt(g, 'ASTARTE', 30, 92, '#e8e4ff', 34); txt(g, 'アスターテ ―月鐘の廃墟―', 32, 116, '#d9b45a', 14); R(g, 32, 124, 180, 1, '#d9b45a');
  if ((G.t * 2 | 0) % 2) txt(g, 'PRESS START / タップで開始', 32, 170, '#ffffff', 11);
  txt(g, '試作版 prototype', 32, 188, '#8a84b0', 9);

}
function drawEnding(g) {
  R(g, 0, 0, VW, VH, '#05040c'); const a = Math.min(1, G.endT / 1.5); g.globalAlpha = a;
  for (let i = 0; i < 40; i++) R(g, (i * 97) % VW, (i * 61 + G.t * 6) % VH, 1, 1, '#6a68a0');
  txt(g, '弔鐘は鳴り止み、月の廃墟に静寂が戻った。', VW / 2, 70, '#e8e0ff', 12, 'center');
  txt(g, 'アスターテは鎌を担ぎ、さらに奥の闇へ――', VW / 2, 92, '#c8c0e8', 11, 'center');
  txt(g, 'THANK YOU FOR PLAYING', VW / 2, 148, '#ffe08a', 20, 'center');
  txt(g, '試作版 ― 撃破: ' + STATS.kills + '　パリィ: ' + STATS.parried + '　致命: ' + STATS.ripostes + '　死亡: ' + STATS.deaths, VW / 2, 176, '#9a94c0', 9, 'center');
  txt(g, '清掃員工房 / カナタゲームズ', VW / 2, 226, '#d9b45a', 12, 'center'); g.globalAlpha = 1;
}
// ---------- loop ----------
let last = 0, acc = 0;
function frame(ts) { const dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts; acc += dt; while (acc >= DT) { update(DT); acc -= DT; } render(); requestAnimationFrame(frame); }
G.step = (n = 1) => { for (let i = 0; i < n; i++) update(DT); render(); };
G.P = P; G.STATS = STATS; G.held = held; G.buf = buf; G.press = press; G.release = release; G.enterRoom = enterRoom; G.startGame = startGame;
G.threats = () => { const out = []; for (const e of G.foes()) { const t = e.threat && e.threat(); if (t) out.push(t); }
  for (const s of G.shots) { if (s.kind === 'pillar') { if (!s.hitP && s.t < s.warn + s.act) out.push({ box: s, t: s.warn - s.t, dur: s.act, parry: false, label: 'boss:toll' }); }
    else { const sp = Math.hypot(s.vx, s.vy) || 1, dl = s.delay > 0 ? s.delay : 0, dx = (P.x + P.w / 2) - (s.x + s.w / 2), tt = Math.max(0, Math.abs(dx) - (P.w + s.w) / 2) / Math.max(1, Math.abs(s.vx)); if (!s.hitP && Math.sign(dx) === Math.sign(s.vx)) out.push({ box: { x: s.x + s.vx * tt - 6, y: s.y + s.vy * tt - 10, w: s.w + 12, h: s.h + 12 }, proj: true, t: tt + dl - .05, dur: (s.w + P.w) / sp, parry: false, label: s.label }); } }
  return out; };
window.G = G;
if (!TESTMODE) requestAnimationFrame(frame); else render();
